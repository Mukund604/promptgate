[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptgate"
version = "0.1.0"
description = "Regression gate for LLM prompts: fail CI when quality, cost or latency gets worse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
promptgate = "promptgate.cli:main"

[tool.setuptools]
packages = ["promptgate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
