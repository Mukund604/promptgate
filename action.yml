name: promptgate
description: Fail the build when a prompt change makes quality, cost or latency worse
inputs:
  suite:
    description: Path to the suite YAML
    required: true
  baseline:
    description: Path to the committed baseline JSON
    required: true
runs:
  using: composite
  steps:
    - run: pip install "${{ github.action_path }}"
      shell: bash
    - run: promptgate check "${{ inputs.suite }}" --baseline "${{ inputs.baseline }}" --report promptgate.md
      shell: bash
    - run: cat promptgate.md >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      if: always()
